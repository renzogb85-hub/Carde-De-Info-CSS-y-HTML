<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="assets/main.css">
</head>

<body>
  <main class="card">
    <div class="card-header">
      <img class="card-image" src="assets/images/illustration-article.svg" alt="Ilustración de la tarjeta">
    </div>

    <div class="card-content">
      <span class="tag">Learning</span>
      <span class="date">Published 21 Dec 2023</span>

      <h2>HTML & CSS foundations</h2>
      <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>

      <div class="author">
        <img src="assets/images/image-avatar.webp" alt="Avatar de Greg Hooper">
        <span>Greg Hooper</span>
      </div>
    </div>
  </main>

  <footer class="attribution">
    <p>
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noreferrer">Frontend Mentor</a>.
      Coded by
      <a href="#">renzooo</a>.
    </p>
  </footer>
</body>

</html>
